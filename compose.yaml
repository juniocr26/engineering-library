name: engineering-library
services:
  postgres:
    image: postgres:18-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      PGDATA: /var/lib/postgresql/18/docker
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5499}:5432"
    volumes:
      - ./.dockerized-postgres:/var/lib/postgresql
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: backend-development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    environment:
      HOME: /tmp
      RAILS_ENV: development
      CATALOG_ROOT: /docs/projects
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?Set SECRET_KEY_BASE}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - ./docs/projects:/docs/projects:ro
      - ./backend:/app/backend
    tmpfs:
      - /app/backend/tmp:mode=1777
      - /app/backend/log:mode=1777
    ports:
      - "127.0.0.1:${BACKEND_PORT:-3098}:3000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: [CMD, ruby, -rnet/http, -e, 'exit(Net::HTTP.get_response(URI("http://127.0.0.1:3000/up")).code == "200" ? 0 : 1)']
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 30
  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: frontend-development
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    init: true
    environment:
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
      BACKEND_URL: http://backend:3000
      DOCUMENTATION_ROOT: /docs/projects
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./docs/img:/docs/img:ro
      - ./frontend:/app/frontend
      - ./docs/projects:/docs/projects:ro
    # Mask host packages/cache; Linux dependencies resolve from /app/node_modules.
    tmpfs:
      - /app/frontend/node_modules:mode=0555
      - /app/frontend/.next:mode=1777
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3099}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: [CMD, node, -e, 'fetch("http://127.0.0.1:3000").then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))']
      interval: 10s
      timeout: 8s
      start_period: 120s
      retries: 20
